<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Company</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header class="site-header">
      <a href="index.html" class="logo">
        <img src="assets/logo.svg" alt="My Company home" />
      </a>

      <div class="header-center">
        <h1>My Company</h1>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="services.html">Services</a>
          <a href="gallery.html">Gallery</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>

      <button
        type="button"
        class="hamburger"
        data-bs-toggle="drawer"
        data-bs-target="#menuDrawer"
        aria-controls="menuDrawer"
        aria-label="Open menu"
      >
        <img src="assets/hamburger.svg" alt="Hamburger icon" />
      </button>

      <button type="button">
        <img src="assets/cart.svg" alt="cart icon" />
      </button>
    </header>

    <dialog
      class="drawer drawer-end"
      tabindex="-1"
      id="menuDrawer"
      aria-labelledby="menuDrawerTitle"
    >
      <div class="menuHeader">
        <h2 class="menuTitle" id="menuDrawerTitle">Menu</h2>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="drawer"
          aria-label="Close menu"
        ></button>
      </div>
      <nav aria-label="Drawer navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </dialog>

    <main>
      <img src="assets/img-1.svg" alt="Image 1" />
      <img src="assets/img-2.svg" alt="Image 2" />
      <img src="assets/img-3.svg" alt="Image 3" />
      <img src="assets/img-4.svg" alt="Image 4" />
      <img src="assets/img-5.svg" alt="Image 5" />
      <img src="assets/img-6.svg" alt="Image 6" />
      <img src="assets/img-7.svg" alt="Image 7" />
      <img src="assets/img-8.svg" alt="Image 8" />
    </main>
  </body>
</html>
