<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <button id="newsletterBtn"></button>

      <div id="logoAndNav">
        <a></a>

        <nav></nav>
      </div>

      <nav id="s"></nav>
    </header>

    <main>
      <div id="featuredItems">
        <article></article>

        <article></article>

        <article></article>
      </div>

      <section id="filtersBar">
        <label for="productsSelectList">Products</label>
        <select id="productsSelectList">
          <option>ALL PRODUCTS</option>
          <option>SEASONAL EDITIONS</option>
          <option>MEMO BOOKS</option>
          <option>PENS AND PENCILS</option>
          <option>PLANNERS AND CALENDERS</option>
          <option>LEATHER COVERS</option>
          <option>PRESS SHEETS</option>
          <option>KITS</option>
        </select>

        <input
          type="text"
          id="searchInput"
          placeholder="Search for a product..."
        />

        <div id="paperFilters">
          <label for="paperStyleList">PAPER STYLES</label>
          <select id="paperStyleList">
            <option>ALL PAPER STYLES</option>
            <option>GRAPH</option>
            <option>RULED</option>
            <option>PLAIN</option>
            <option>DOT-GRAPH</option>
            <option>LEDGER</option>
            <option>CHECKLIST</option>
            <option>PLANNER</option>
          </select>

          <label for="paperSizeList">SIZES</label>
          <select id="paperSizeList">
            <option>ALL SIZES</option>
            <option>3.5×5.5" (89×140 mm)</option>
            <option>3.75×8" (95×203 mm)</option>
            <option>4.25×6.5" (108×165 mm)</option>
            <option>4.75×7.5" (120×190 mm)</option>
            <option>6×8" (152×203 mm)</option>
            <option>6×9" (152×228 mm)</option>
          </select>
        </div>
      </section>

      <section id="productCards"></section>
    </main>
    <footer></footer>
  </body>
</html>
